<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Logos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #030303;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 15px;
      padding: 30px;
    }

    .logo-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: linear-gradient(135deg, #111111, #1a1a1a);
      border: 2px solid #c0c0c0;
      border-radius: 8px;
      padding: 10px 18px;
      width: 380px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(192, 192, 192, 0.15);
    }

    .scene {
      perspective: 800px;
    }

    .coin {
      width: 60px;
      height: 60px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(10deg);
      animation: professionalSpin 7s linear infinite;
    }

    .coin-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      overflow: hidden;
    }

    .coin-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .coin-front {
      transform: translateZ(6px);
    }

    .coin-back {
      transform: rotateY(180deg) translateZ(6px) scaleX(-1);
    }

    .logo-title {
      color: #f3f4f6;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    @keyframes professionalSpin {
      0% {
        transform: rotateX(10deg) rotateY(0deg);
      }
      100% {
        transform: rotateX(10deg) rotateY(360deg);
      }
    }
  </style>
</head>
