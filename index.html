<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Logos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #030303;
      overflow-x: hidden;
      font-family: sans-serif;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 60px;
      padding: 80px 20px;
    }

    .logo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .scene {
      perspective: 1400px;
    }

    .coin {
      width: 260px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(12deg);
      animation: professionalSpin 7s linear infinite;
    }

    .coin-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      overflow: hidden;
    }

    .coin-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .coin-front {
      transform: translateZ(12px);
    }

    .coin-back {
      transform: rotateY(180deg) translateZ(12px) scaleX(-1);
    }

    .logo-title {
      color: #e5e7eb;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @keyframes professionalSpin {
      0% {
        transform: rotateX(12deg) rotateY(0deg);
      }
      100% {
        transform: rotateX(12deg) rotateY(360deg);
      }
    }
  </style>
</head>
