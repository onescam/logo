<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Packages</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      pointer-events: none;
    }

    body, html {
      width: 100%;
      min-height: 100vh;
      background-color: #030303;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .view {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    #main-view {
      gap: 12px;
      max-width: 100%;
      margin: 0 auto;
      padding: 20px;
    }

    .package-row {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      background: linear-gradient(135deg, #0d0d0d, #161616);
      border: 2px solid #c0c0c0;
      border-radius: 10px;
      padding: 10px 25px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(120px);
      animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .package-row:hover {
      transform: translateY(0) scale(1.005) !important;
      box-shadow: 0 0 20px rgba(192, 192, 192, 0.25);
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(120px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scene {
      perspective: 800px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .coin {
      width: 90px;
      height: 90px;
      position: relative;
      transform-style: preserve-3d;
      animation: smoothSpin 6s linear infinite;
    }

    .coin-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .coin-side img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .coin-back {
      transform: rotateY(180deg);
    }

    .package-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f3f4f6;
    }

    #detail-view {
      position: relative;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      gap: 20px;
      padding: 30px 20px;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 650px;
      gap: 20px;
      margin-bottom: 10px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #c0c0c0;
      font-size: 32px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: #ffffff;
    }

    .detail-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-align: left;
    }

    .detail-logo-container {
      width: 250px;
      height: 250px;
      margin: 10px 0;
      pointer-events: none;
    }

    .detail-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .detail-info {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: radial-gradient(circle at 50% 50%, #000000 0%, #000d1a 50%, #001f3f 100%);
      border: 2px solid #c0c0c0;
      padding: 25px 35px;
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      font-size: 17px;
      text-align: left;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 31, 63, 0.5);
    }

    .detail-info div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(192, 192, 192, 0.2);
      padding-bottom: 10px;
    }

    .detail-info span {
      color: #a0aec0;
    }

    .detail-info strong {
      color: #ffffff;
    }

    .upgrade-btn {
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 5px;
    }

    .upgrade-btn:hover {
      background-color: #0056b3;
      transform: scale(1.02);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #000000;
      border: 2px solid #c0c0c0;
      border-radius: 16px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 30px rgba(192, 192, 192, 0.15);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #c0c0c0;
    }

    .crypto-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .crypto-btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: #000000;
      border: 1px solid #c0c0c0;
      border-radius: 10px;
      padding: 14px 20px;
      cursor: pointer;
      gap: 15px;
      transition: background 0.2s;
    }

    .crypto-btn:hover {
      background: #111111;
    }

    .crypto-btn img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .crypto-name {
      font-size: 18px;
      font-weight: 700;
      color: #c0c0c0;
    }

    .payment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #c0c0c0;
      padding-bottom: 12px;
    }

    .payment-price-usd {
      font-size: 22px;
      font-weight: 700;
      color: #c0c0c0;
    }

    .payment-price-crypto {
      font-size: 18px;
      font-weight: 600;
      color: #c0c0c0;
    }

    .status-field {
      background: #000000;
      border: 1px solid #c0c0c0;
      border-radius: 10px;
      padding: 15px;
      font-size: 14px;
      font-weight: 700;
      color: #c0c0c0;
      letter-spacing: 1px;
    }

    .copy-btn {
      background: #000000;
      color: #c0c0c0;
      border: 1px solid #c0c0c0;
      border-radius: 25px;
      padding: 12px 25px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      align-self: center;
      transition: background 0.2s, color 0.2s;
    }

    .copy-btn:hover {
      background: #c0c0c0;
      color: #000000;
    }

    .warning-text {
      font-size: 13px;
      color: #c0c0c0;
      line-height: 1.5;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: #c0c0c0;
      font-size: 24px;
      cursor: pointer;
    }

    .close-modal:hover {
      color: #ffffff;
    }

    @keyframes smoothSpin {
      0% {
        transform: rotateY(0deg);
      }
      100% {
        transform: rotateY(360deg);
      }
    }

    @media (max-width: 768px) {
      .package-title {
        font-size: 15px;
      }
      .package-row {
        padding: 8px 15px;
        gap: 15px;
      }
      .coin {
        width: 70px;
        height: 70px;
      }
      .detail-title {
        font-size: 18px;
      }
      .detail-info {
        padding: 20px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="main-view" class="view active"></div>

  <div id="detail-view" class="view">
    <div class="detail-header">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="detail-title" id="detail-name"></div>
    </div>
    <div class="detail-logo-container">
      <img id="detail-img" src="" alt="Token Logo">
    </div>
    <div class="detail-info" id="detail-specs"></div>
    <button class="upgrade-btn" onclick="openPaymentModal()">Upgrade</button>
  </div>

  <div class="modal-overlay" id="payment-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal('payment-modal')">×</button>
      <div class="modal-title">Payment Method</div>
      <div class="crypto-options">
        <div class="crypto-btn" onclick="selectCrypto('BTC', 68000)">
          <img src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png" alt="BTC">
          <span class="crypto-name">BTC</span>
        </div>
        <div class="crypto-btn" onclick="selectCrypto('ETH', 2600)">
          <img src="https://assets.coingecko.com/coins/images/279/large/ethereum.png" alt="ETH">
          <span class="crypto-name">ETH</span>
        </div>
        <div class="crypto-btn" onclick="selectCrypto('USDT', 1)">
          <img src="https://assets.coingecko.com/coins/images/325/large/Tether.png" alt="USDT">
          <span class="crypto-name">USDT</span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="crypto-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal('crypto-modal')">×</button>
      <div class="payment-header">
        <div class="payment-price-usd" id="pay-price-usd">$0.00</div>
        <div class="payment-price-crypto" id="pay-price-crypto">0.00 BTC</div>
      </div>
      <div class="status-field" id="status-text">OPTION NOT AVAILABLE YET</div>
      <button class="copy-btn" onclick="copyStatusText()">Copy</button>
      <div class="warning-text">
        Please send the exact amount to the specified crypto address, otherwise the payment will be invalid.
      </div>
    </div>
  </div>

  <script>
    const packages = [
      {
        name: "STARTER AI PACKAGE",
        price: "$150.00",
        numericPrice: 150,
        fee: "6.0%",
        allocation: "15 Trades / day",
        concurrent: "2 simultaneously",
        neural: "390 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF.HEIC"
      },
      {
        name: "SMART TRADER PACKAGE",
        price: "$380.00",
        numericPrice: 380,
        fee: "6.0%",
        allocation: "20 Trades / day",
        concurrent: "3 simultaneously",
        neural: "520 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%202.HEIC"
      },
      {
        name: "PRO AI TRADER PACKAGE",
        price: "$950.00",
        numericPrice: 950,
        fee: "6.0%",
        allocation: "25 Trades / day",
        concurrent: "5 simultaneously",
        neural: "650 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%203.HEIC"
      },
      {
        name: "EXECUTIVE TRADER PACKAGE",
        price: "$2,400.00",
        numericPrice: 2400,
        fee: "5.5%",
        allocation: "35 Trades / day",
        concurrent: "8 simultaneously",
        neural: "910 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%204.HEIC"
      },
      {
        name: "TYCOON AI PACKAGE",
        price: "$6,000.00",
        numericPrice: 6000,
        fee: "5.5%",
        allocation: "50 Trades / day",
        concurrent: "12 simultaneously",
        neural: "1,300 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%205.HEIC"
      },
      {
        name: "EXECUTIVE TYCOON PACKAGE",
        price: "$15,000.00",
        numericPrice: 15000,
        fee: "5.0%",
        allocation: "70 Trades / day",
        concurrent: "18 simultaneously",
        neural: "1,820 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%206.HEIC"
      },
      {
        name: "PREMIUM TRADER PACKAGE",
        price: "$37,500.00",
        numericPrice: 37500,
        fee: "5.0%",
        allocation: "90 Trades / day",
        concurrent: "25 simultaneously",
        neural: "2,340 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%207.HEIC"
      },
      {
        name: "INFINITY TRADER PACKAGE",
        price: "$93,500.00",
        numericPrice: 93500,
        fee: "4.5%",
        allocation: "120 Trades / day",
        concurrent: "40 simultaneously",
        neural: "3,120 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%208.HEIC"
      },
      {
        name: "ULTIMATE AI PACKAGE",
        price: "$235,000.00",
        numericPrice: 235000,
        fee: "4.0%",
        allocation: "150 Trades / day",
        concurrent: "65 simultaneously",
        neural: "3,900 Trades",
        img: "https://raw.githubusercontent.com/onescam/logo/main/%D0%98%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D0%B6%D0%B5%D0%BD%D0%B8%D0%B5%20HEIF%209.HEIC"
      }
    ];

    const mainView = document.getElementById('main-view');
    const detailView = document.getElementById('detail-view');
    const detailImg = document.getElementById('detail-img');
    const detailName = document.getElementById('detail-name');
    const detailSpecs = document.getElementById('detail-specs');
    const paymentModal = document.getElementById('payment-modal');
    const cryptoModal = document.getElementById('crypto-modal');

    let currentPackage = null;

    function renderMain() {
      mainView.innerHTML = '';
      const totalDuration = 3.5;
      const delayStep = totalDuration / packages.length;

      packages.forEach((pkg, index) => {
        const row = document.createElement('div');
        row.className = 'package-row';
        row.style.animationDelay = `${(index * delayStep).toFixed(2)}s`;
        row.onclick = () => showDetail(pkg);
        row.innerHTML = `
          <div class="scene">
            <div class="coin">
              <div class="coin-side"><img src="${pkg.img}" alt="${pkg.name}"></div>
              <div class="coin-side coin-back"><img src="${pkg.img}" alt="${pkg.name}"></div>
            </div>
          </div>
          <div class="package-title">${pkg.name}</div>
        `;
        mainView.appendChild(row);
      });
    }

    function showDetail(pkg) {
      currentPackage = pkg;
      mainView.classList.remove('active');
      detailView.classList.add('active');
      detailImg.src = pkg.img;
      detailName.textContent = pkg.name;
      detailSpecs.innerHTML = `
        <div><span>Package Price:</span> <strong>${pkg.price}</strong></div>
        <div><span>Withdrawal Fee:</span> <strong>${pkg.fee}</strong></div>
        <div><span>Daily Trade Allocation:</span> <strong>${pkg.allocation}</strong></div>
        <div><span>Max. Concurrent Execution:</span> <strong>${pkg.concurrent}</strong></div>
        <div><span>NEURAL CAP:</span> <strong>${pkg.neural}</strong></div>
      `;
    }

    function goBack() {
      detailView.classList.remove('active');
      mainView.classList.add('active');
    }

    function openPaymentModal() {
      paymentModal.classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function selectCrypto(symbol, rate) {
      closeModal('payment-modal');
      if (currentPackage) {
        document.getElementById('pay-price-usd').textContent = currentPackage.price;
        let amount = (currentPackage.numericPrice / rate);
        let formatted = symbol === 'USDT' ? amount.toLocaleString() : amount.toFixed(6);
        document.getElementById('pay-price-crypto').textContent = `${formatted} ${symbol}`;
      }
      cryptoModal.classList.add('active');
    }

    function copyStatusText() {
      const text = document.getElementById('status-text').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Text copied to clipboard!');
      });
    }

    renderMain();
  </script>
</body>
</html>
